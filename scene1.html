<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Scene 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Itim:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Itim', sans-serif;
        }

        body {
            background: white;
        }

        /* กรอบจอมือถือ (เหมือนหน้า Home) */
        .mobile-frame {
            width: 390px;
            aspect-ratio: 1 / 2;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        /* รูปในซีน */
        .mobile-frame img {
            object-fit: cover;
        }

        /* ปุ่มถัดไป (ขวาล่าง) */
        .next-btn {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgb(255 255 255 / 38%);
            color: #000;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .next-btn:hover {
            background: #252525;
            color: #ffffff;
        }

        /* ปุ่มเริ่มใหม่ (ซ้ายบน) */
        .restart-btn {
            position: absolute;
            left: 12px;
            top: 12px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgb(255 255 255 / 38%);
            color: #000;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .restart-btn:hover {
            background: #252525;
            color: #ffffff;
        }

        /* Responsive มือถือ */
        @media (max-width: 768px) {
            .mobile-frame {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                aspect-ratio: auto;
            }
        }
    </style>
</head>

<body>
    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="mobile-frame">

            <!-- ปุ่มเริ่มใหม่ -->
            <button class="restart-btn" onclick="playSound(); restart()">
                <i class="fa-solid fa-rotate-left"></i>
            </button>

            <!-- รูป -->
            <img id="slide" src="pic/scene1-1.png">

            <!-- ปุ่มถัดไป -->
            <button class="next-btn" onclick="playSound(); nextImage()">
                <i class="fa-solid fa-chevron-right"></i>
            </button>

        </div>
    </div>

    <script>
        const images = [
            "pic/scene1-1.png",
            "pic/scene1-2.png",
            "pic/scene1-3.png",
            "pic/scene1-4.png",
            "pic/scene1-5.png",
            "pic/scene1-6.png"
        ];

        let index = 0;

        function playSound() {
            const sound = document.getElementById("clickSound");
            sound.currentTime = 0;
            sound.play();
        }

        function nextImage() {
            if (index < images.length - 1) {
                index++;
                document.getElementById("slide").src = images[index];
            } else {
                window.location.href = "scene2.html";
            }
        }

        function restart() {
            window.location.href = "index.html";
        }
    </script>

    <audio id="clickSound" src="sound/click.mp3"></audio>
</body>

</html>
