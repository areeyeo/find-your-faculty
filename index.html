<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Find Your Faculty</title>
    <link href="https://fonts.googleapis.com/css2?family=Itim:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Itim', sans-serif;
        }

        body {
            background: white;
        }

        /* กรอบจอมือถือ */
        .mobile-frame {
            width: 390px;
            aspect-ratio: 1 / 2;
            background: black;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        /* หน้า Home */
        .home-screen {
            background-image: url("pic/home1.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* overlay บนภาพ */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 40px 20px;
        }
    </style>
</head>

<body>
    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="mobile-frame home-screen">
            <div class="overlay">
                <button onclick="playSound(); startGame()" class="btn btn-dark rounded-pill px-4 py-2">
                    เริ่มค้นหาตัวเอง
                </button>
            </div>
        </div>
    </div>

    <script>
        function playSound() {
            const sound = document.getElementById("clickSound");
            sound.currentTime = 0;
            sound.play();
        }

        function startGame() {
            window.location.href = "scene1.html";
        }
    </script>

    <audio id="clickSound" src="sound/click.mp3"></audio>
</body>

</html>
